# Créditos de fotografía

La interfaz usa fotografía real optimizada localmente en WebP. Las imágenes de referencia fueron seleccionadas de Unsplash y utilizadas bajo la Unsplash License vigente al momento de preparar el sitio.

- `dev-workspace-*`: fotografía de espacio de desarrollo / múltiples monitores — Jakub Żerdzicki, Unsplash.
- `dev-team-*`: equipo de desarrollo — Mushvig Niftaliyev, Unsplash.
- `cctv-*`: cámaras CCTV — Alexis Fauvet, Unsplash.
- `server-rack-*`: infraestructura de servidores — Kevin Ache, Unsplash.
- `motherboard-pro-*`: fotografía de motherboard utilizada en la versión previa de PulseDesk, basada en material de Unsplash.
- `hardware-technician-*`, `cpu-install-*`, `pc-maintenance-*`, `server-network-*`, `code-closeup-*`, `totem-kiosk-*`: material fotográfico gratuito de Unsplash seleccionado para esta experiencia.

Antes de una campaña comercial masiva conviene reemplazar progresivamente las imágenes genéricas por fotografías propias de trabajos PulseDesk. Eso aumenta autenticidad, diferenciación y confianza.
