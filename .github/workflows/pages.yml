name: Deploy PulseDesk to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve public URL and build
        env:
          CUSTOM_SITE_URL: ${{ vars.SITE_URL }}
        shell: bash
        run: |
          if [ -n "$CUSTOM_SITE_URL" ]; then
            SITE_URL="${CUSTOM_SITE_URL%/}"
          else
            OWNER="${GITHUB_REPOSITORY%%/*}"
            REPO="${GITHUB_REPOSITORY#*/}"
            if [ "$REPO" = "$OWNER.github.io" ]; then
              SITE_URL="https://$OWNER.github.io"
            else
              SITE_URL="https://$OWNER.github.io/$REPO"
            fi
          fi
          echo "Building for $SITE_URL"
          python tools/build.py --site-url "$SITE_URL"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
